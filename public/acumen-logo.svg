<svg xmlns="http://www.w3.org/2000/svg" width="320" height="64" viewBox="0 0 320 64">
  <!-- Transparent background — no fill on root element -->

  <!-- Aperture mark centred at (32, 32) -->
  <g transform="translate(32, 32)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#534AB7" stroke-width="2" opacity="0.20"/>
    <!-- Mid ring -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#534AB7" stroke-width="2" opacity="0.45"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#534AB7" stroke-width="2" opacity="0.75"/>
    <!-- Focal dot -->
    <circle cx="0" cy="0" r="3.5" fill="#534AB7"/>
    <!-- Cardinal ticks on outer ring -->
    <line x1="0"   y1="-26" x2="0"   y2="-21" stroke="#534AB7" stroke-width="1.75" stroke-linecap="round" opacity="0.55"/>
    <line x1="26"  y1="0"   x2="21"  y2="0"   stroke="#534AB7" stroke-width="1.75" stroke-linecap="round" opacity="0.55"/>
    <line x1="0"   y1="26"  x2="0"   y2="21"  stroke="#534AB7" stroke-width="1.75" stroke-linecap="round" opacity="0.55"/>
    <line x1="-26" y1="0"   x2="-21" y2="0"   stroke="#534AB7" stroke-width="1.75" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- Thin vertical divider -->
  <line x1="70" y1="14" x2="70" y2="50" stroke="#534AB7" stroke-width="0.75" opacity="0.30"/>

  <!-- Wordmark -->
  <text
    x="82"
    y="35"
    dominant-baseline="central"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="26"
    font-weight="400"
    letter-spacing="-0.3"
    fill="#1a1a2e"
  >Acumen</text>

  <!-- Tagline -->
  <text
    x="83"
    y="51"
    dominant-baseline="central"
    font-family="'Helvetica Neue', 'Arial', sans-serif"
    font-size="8.5"
    font-weight="400"
    letter-spacing="2.8"
    fill="#534AB7"
    opacity="0.75"
  >TALENT INTELLIGENCE</text>
</svg>
